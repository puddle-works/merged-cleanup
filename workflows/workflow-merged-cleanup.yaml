id: 88a7ffe6-d77c-4df2-ad10-811d6da8b4ca
name: "@puddleworks/merged-cleanup"
description: "For merged PRs in the repository of the current directory, report whether each one's worktree and branches are safe to clean up (check), and clean up those that are (clean): remove the worktree, delete the local branch and origin's branch with a lease on the PR's head, and fast-forward main."
version: 1
tags:
  puddle: "true"
  maxReruns: "5"
  maxWallClock: "30m"

inputs:
  type: object
  properties:
    pr:
      type: integer
      description: "A PR number to check or clean up; 0 means none named."
      default: 0
    prs:
      type: string
      description: "Up to 5 more PR numbers, comma-separated, digits only; together with pr at most 5. With none named, the latest 3 merged PRs that still have a worktree at their head."
      default: ""
  required: []

jobs:
  - name: main
    description: "Run merged-cleanup once with the user's inputs."
    dependsOn: []
    weight: 0
    steps:
      - name: run
        description: "Per PR: its number, title, verdict (clean, primary, dirty, locked, ahead, absent, open, closed, error), worktree, branch and a one-line reason; for clean, each step (remove worktree, delete local branch, delete origin branch, fast-forward main) as done, already done, skipped with why, or failed with the error; then a one-line summary, or \"Nothing to clean up\" when there is none."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: merged-cleanup-model
          methodName: run
          inputs:
            pr: ${{ inputs.pr }}
            prs: ${{ inputs.prs }}
